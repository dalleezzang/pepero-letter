<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#faf7ef"><title>빼빼로 편지</title><link rel="stylesheet" href="style.css">
<meta name="description" content="빼빼로 편지가 도착했어요. 상자를 열어 마음을 확인해 보세요.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="빼빼로 편지">
<meta property="og:title" content="빼빼로 편지가 도착했어요">
<meta property="og:description" content="상자를 열어 마음을 확인해 보세요.">
<meta property="og:image" content="https://dalleezzang.github.io/pepero-letter/share-preview-sticks.png">
<meta property="og:image:width" content="2400">
<meta property="og:image:height" content="1260">
<meta property="og:image:alt" content="흰 배경에 빼빼로 과자로 쓴 빼빼로 편지가 도착했어요">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="빼빼로 편지가 도착했어요">
<meta name="twitter:description" content="상자를 열어 마음을 확인해 보세요.">
<meta name="twitter:image" content="https://dalleezzang.github.io/pepero-letter/share-preview-sticks.png">
</head>
<body><header><a class="brand" href="./"><img class="brand-mark" src="pepero-heart.png" alt="" width="46" height="46"> 빼빼로 편지</a><a href="./" class="make-own">나도 만들기 ↗</a></header>
<main>
<section class="studio"><div class="preview-column"><div class="send-fields"><label>받는 사람<input id="to" maxlength="12" placeholder="입력" aria-label="받는 사람"></label><label>보내는 사람<input id="from" maxlength="12" placeholder="입력" aria-label="보내는 사람"></label></div><div class="card-wrap"><button id="open-letter" type="button"><span>클릭해서 열기</span></button><div id="empty-state">눌러서 마음을 써보세요</div><span id="name-to" class="scene-signature"></span><span id="name-from" class="scene-signature"></span><textarea id="message" class="card-input" maxlength="24" aria-label="카드에 문구 입력" spellcheck="false" autofocus></textarea><canvas id="card" width="1200" height="1200" role="img" aria-label="입력한 글자를 빼빼로 획으로 그린 카드"></canvas><div id="flight-layer" aria-hidden="true"></div><div id="snack-box" aria-hidden="true"><div class="box-lid"></div><div class="box-sticks"><i></i><i></i><i></i></div><div class="box-front"><span>빼빼로</span><b>Ⅱ</b><small>♥</small></div></div></div><div class="received-actions" id="received-actions"><button id="replay" class="secondary">↻ 다시 보기</button></div></div>
<aside>
<button id="pack" class="primary">포장하기 <span>↗</span></button><button id="save" class="secondary">↓ 이미지 저장</button></aside></section>
</main><dialog id="package-dialog" aria-label="포장한 편지"><button id="close-package" class="close-package" aria-label="닫기">×</button><div class="package-stage"><div id="parcel" class="box-parcel"><div class="box-net"><div class="net-base"><img id="letter-image" alt="빼빼로 편지 미리보기"></div><div class="net-wall net-left"><div class="net-cover"><img id="box-print" alt="빼빼로 상자 앞면"><div class="box-trim" aria-hidden="true"><i class="lace-edge left"></i><i class="lace-edge right"></i><i class="raised-heart h1">♥</i><i class="raised-heart h2">♥</i><i class="raised-heart h3">♥</i><div class="satin-band"></div><div class="raised-bow"><i class="bow-tail left"></i><i class="bow-tail right"></i><i class="bow-loop left"></i><i class="bow-loop right"></i><i class="bow-knot"></i><i class="bow-gem"></i><i class="gem-chain"></i><i class="gem-drop"></i></div></div></div></div><div class="net-wall net-right"></div><div class="net-wall net-top"><div class="net-tab"></div></div><div class="net-wall net-bottom"><div class="net-tab"></div></div></div></div></div><div id="box-options" role="group" aria-label="박스 디자인"></div><div class="package-actions"><button id="unpack" class="secondary">편지 보기</button><button id="share" class="primary">공유하기 ↗</button></div><div id="share-result" hidden><div class="share-link-row"><input id="share-url" readonly aria-label="공유 링크"><button id="copy-url">복사</button></div><a id="preview-link" target="_blank" rel="noopener">받는 화면 미리보기 ↗</a></div></dialog><div id="toast" role="status" aria-live="polite"></div><script type="module" src="app.js"></script></body></html>
